<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Horas Extras e Lanches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap">
<style>
/* Layout: cabeçalho fixo com abas; painel em cartões + gráficos; lançamento em modal; configurações do RH em abas. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface2:#e9eef7; --line:#d6deec; --fg:#0f1a2b; --muted:#566782;
  --accent:#2563eb; --accent-fg:#ffffff; --accent-soft:#dbe7fd; --inputbg:#ffffff; --glow:rgba(37,99,235,.10);
  --warm:#b45f06; --warm-soft:#f7e6cf;
  --ok:#1b7a43; --ok-soft:#d9efe2; --warn:#8a5a00; --warn-soft:#faedc9; --bad:#b3261e; --bad-soft:#f8dedb; --bad-fg:#ffffff;
  --c1:#2563eb; --c2:#c47a10; --c3:#0f9488; --c4:#b03a86; --c5:#5f8f1f; --c6:#76708a;
  --shadow:0 1px 2px rgba(15,26,43,.06),0 4px 14px rgba(15,26,43,.05);
  --font:"DM Sans","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Syne","DM Sans","Segoe UI Variable",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060a11; --surface:#0f1624; --surface2:#162033; --line:#1f2b40; --fg:#e7edf8; --muted:#8c9bb6;
    --accent:#3b82f6; --accent-fg:#ffffff; --accent-soft:#14284d; --inputbg:#0b111c; --glow:rgba(59,130,246,.18);
    --warm:#e3a24c; --warm-soft:#3d2c12;
    --ok:#5fcf8b; --ok-soft:#143a25; --warn:#e8b94a; --warn-soft:#3b2f0d; --bad:#f08278; --bad-soft:#42201d; --bad-fg:#2a0b08;
    --c1:#5b9bff; --c2:#e3a24c; --c3:#2fc4b2; --c4:#e07fb8; --c5:#9dc058; --c6:#a3a0b8;
    --shadow:0 1px 2px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#060a11; --surface:#0f1624; --surface2:#162033; --line:#1f2b40; --fg:#e7edf8; --muted:#8c9bb6;
    --accent:#3b82f6; --accent-fg:#ffffff; --accent-soft:#14284d; --inputbg:#0b111c; --glow:rgba(59,130,246,.18);
    --warm:#e3a24c; --warm-soft:#3d2c12;
    --ok:#5fcf8b; --ok-soft:#143a25; --warn:#e8b94a; --warn-soft:#3b2f0d; --bad:#f08278; --bad-soft:#42201d; --bad-fg:#2a0b08;
    --c1:#5b9bff; --c2:#e3a24c; --c3:#2fc4b2; --c4:#e07fb8; --c5:#9dc058; --c6:#a3a0b8;
    --shadow:0 1px 2px rgba(0,0,0,.5);
    color-scheme:dark;
}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;position:absolute;left:0;top:0;width:100%;padding:18px;color:#000;background:#fff;font:12px/1.4 Arial,sans-serif}
  #printArea table{width:100%;border-collapse:collapse;font-size:11px}
  #printArea th,#printArea td{border:1px solid #888;padding:4px 6px;text-align:left}
}
#printArea{display:none}
@media print{
  html:root:root:root{--bg:#fff;--surface:#fff;--surface2:#eceff5;--line:#c9d1e0;--fg:#0f1a2b;--muted:#4b5a75;--accent:#2563eb;--accent-soft:#dbe7fd;--warm:#b45f06;--warn:#8a5a00;--warn-soft:#faedc9;--ok:#1b7a43;--bad:#b3261e;--c1:#2563eb;--c2:#c47a10;--c3:#0f9488;--c4:#b03a86;--c5:#5f8f1f;--c6:#76708a;--shadow:none;color-scheme:light}
  body{background:#fff!important}
  #printArea .printvis{display:grid;gap:10px;margin:0 0 12px}
  #printArea .kpi,#printArea .panel{box-shadow:none;border:1px solid #c9d1e0;break-inside:avoid;background:#fff}
  #printArea .kpi{padding:8px 10px}#printArea .kn{font-size:1.3rem}#printArea .kn.txt{font-size:.9rem}
  #printArea .rcards,#printArea .kpis{grid-template-columns:repeat(5,1fr);gap:8px}
  #printArea .grid2{grid-template-columns:1fr 1fr;gap:10px}
  #printArea .panel{padding:10px}
  #printArea svg.col{max-width:100%}
  #printArea .btn{display:none}
  #printArea h2{font-size:.9rem}
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%}
h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
h2{font-size:1rem;margin:0 0 .6rem}
p{margin:0 0 .6rem}
.muted{color:var(--muted)} .small{font-size:.82rem}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
main.wrap{padding-block:16px 96px;display:grid;gap:14px}
.num{text-align:right;font-variant-numeric:tabular-nums}

header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;letter-spacing:-.01em}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:1.1rem}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;flex:1 1 auto}
.tab{font:inherit;font-weight:600;padding:.5rem .85rem;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:38px}
.tab[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}
.who span{display:block;line-height:1.2}.who small{display:block;color:var(--muted)}

.btn{font:inherit;font-weight:600;padding:.5rem .9rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);color:var(--bad-fg);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:.2rem .6rem;font-size:.85rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:999px;padding:.85rem 1.2rem;box-shadow:0 6px 20px rgba(0,0,0,.28)}

.fld{display:grid;gap:4px;font-weight:600;font-size:.85rem;min-width:0}
.fld.grow{flex:1 1 220px}
input,select,textarea{font:inherit;font-weight:400;padding:.5rem .65rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-height:40px;width:100%;min-width:0}
textarea{resize:vertical}
.chk{display:flex;gap:.5rem;align-items:center;font-weight:500;min-height:40px}
.chk input{width:auto;min-height:0}
.err{color:var(--bad);font-weight:600}.err:empty{display:none}
.two{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center}.row>select,.row>input{flex:1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.pagehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .sp{flex:1}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kl{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kn{font-size:2rem;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.ks{color:var(--muted);font-size:.82rem;min-height:1.2em}
.kpi.warm .kn{color:var(--warm)}
.kpi.attn .kn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px}

.bars{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.bars li{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:10px;align-items:center}
.bl,.bl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;overflow-wrap:anywhere}
.bt{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:6px}
.bv{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.2em;text-align:right}
.badge{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;font-size:.7rem;font-weight:700;background:var(--warn-soft);color:var(--warn)}
svg.col{width:100%;max-width:640px;height:auto;display:block}
.col .bar{fill:var(--accent)}.col .gl{stroke:var(--line);stroke-width:1}.col .ax{fill:var(--muted);font-size:11px;font-family:inherit}
.donutbox{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
svg.donut{width:150px;height:150px;flex:none}.donut .dn{font-size:5px;font-weight:700;fill:var(--fg);font-family:inherit}
.legend{grid-template-columns:minmax(0,1fr);list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1 1 180px;min-width:0}
.legend li{display:flex;gap:8px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-variant-numeric:tabular-nums;font-weight:600}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.tbl td.act{white-space:nowrap}.tbl td.act .btn{margin:0 4px 0 0}
.tbl td small{display:block;color:var(--muted);max-width:34ch}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700}
.p-pendente{background:var(--warn-soft);color:var(--warn)}.p-aprovado{background:var(--ok-soft);color:var(--ok)}.p-recusado{background:var(--bad-soft);color:var(--bad)}
@media (max-width:760px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tfoot{display:block}
  .tbl tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 4px;background:var(--surface)}
  .tbl td{display:flex;justify-content:space-between;gap:14px;border:0;padding:4px 8px;text-align:right}
  .tbl td::before{content:attr(data-label);color:var(--muted);font-weight:600;text-align:left;flex:none}
  .tbl td small{max-width:none}
  .tbl td.act{justify-content:flex-start;flex-wrap:wrap}.tbl td.act::before{display:none}
  .tbl tfoot td{border-top:0}
}

.subtabs{display:flex;gap:6px;overflow-x:auto}
.subtabs .tab{border:1px solid var(--line);background:var(--surface)}
.subtabs .tab[aria-current=page]{border-color:var(--accent)}
.crudform{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;align-items:end}
.crudform h2,.crudform>p,.crudform .crudbtns,.crudform .wide{grid-column:1/-1}
.crudbtns{display:flex;gap:8px;flex-wrap:wrap}
.danger-zone{border-color:var(--bad)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(94vw,520px);max-height:92dvh;box-shadow:0 24px 60px rgba(0,0,0,.4);overflow:hidden}
dialog.lg{width:min(94vw,640px)}
dialog::backdrop{background:rgba(6,16,16,.6)}
.dlgbox{padding:20px;display:grid;gap:14px;max-height:92dvh;overflow:auto}
.dlgact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:560px){dialog.lg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}.dlgbox{max-height:100dvh}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);padding:3px 4px 3px 11px;border-radius:999px;font-weight:600}
.chip button{border:0;background:transparent;color:inherit;font-size:1.15rem;line-height:1;cursor:pointer;padding:0 6px}
.info{background:var(--surface2);border-radius:8px;padding:.6rem .8rem;display:grid;gap:4px}
.info .w{color:var(--warn);font-weight:600}.info .bad{color:var(--bad);font-weight:600}

.loginwrap{min-height:100dvh;display:grid;place-items:center;padding:16px}
.logincard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(100%,400px);display:grid;gap:14px;box-shadow:var(--shadow)}
.logincard .brand{font-size:1.15rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-weight:600;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:no-preference){#toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}}

.sw{position:relative;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw:last-child{border-bottom:0}
.sw .sl{display:grid;gap:2px;min-width:0}.sw .sl b{font-weight:600}.sw .sl small{color:var(--muted)}
.sw input{position:absolute;opacity:0;width:44px;height:26px;right:0;margin:0;cursor:pointer}
.sw .tg{flex:none;width:44px;height:26px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:background .15s}
.sw .tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked+.tg{background:var(--accent);border-color:var(--accent)}
.sw input:checked+.tg::after{transform:translateX(18px);background:var(--accent-fg)}
.sw input:focus-visible+.tg{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sw .tg,.sw .tg::after{transition:none}}
.qa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:8px;background:var(--surface2)}
.qa input{flex:1 1 140px;min-height:36px}
.btn.plus{padding:.5rem .8rem;font-size:1.1rem;line-height:1;flex:none}
.srow{display:grid;grid-template-columns:minmax(90px,36%) 1fr auto;gap:10px;align-items:center}
.stack{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.st{display:flex;height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}
.st i{display:block;height:100%;border-right:1px solid var(--surface)}
.legend.inline{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;flex:none}
.legend.inline li{gap:6px}
.col .vl{fill:var(--fg);font-size:10px;font-weight:600;font-family:inherit}
.col .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sumbox{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.sumbox b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.sumbox span{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rule{grid-column:1/-1;background:var(--warm-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:.88rem}
.kpi .kn.txt{font-size:1.05rem;line-height:1.3;letter-spacing:0;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:.7rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.tag.t-warn{background:var(--warn-soft);color:var(--warn)}
.p-rascunho{background:var(--surface2);color:var(--muted)}.p-enviado{background:var(--ok-soft);color:var(--ok)}
.sigline{display:flex;gap:24px;margin:10px 0}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline}
.pwtoggle{font-weight:500}

/* ---- ícones, login, relatórios ---- */
.ic{width:1.1em;height:1.1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem}
.btn.icon{padding:.3rem .5rem;min-height:32px;min-width:34px}
.btn.icon .lbl{display:none}
.btn.warnbtn{color:var(--bad);border-color:var(--bad)}
.btn.warnbtn:hover{background:var(--bad-soft)}
.btn.okbtn{color:var(--ok);border-color:var(--ok)}
.btn.okbtn:hover{background:var(--ok-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.themebtn{min-height:36px;min-width:36px;padding:.3rem}
@media (max-width:760px){.btn.icon .lbl{display:inline}}
.loginwrap{background:radial-gradient(900px 500px at 78% -8%,var(--glow),transparent 60%),var(--bg)}
.logincard{padding:0;gap:0;overflow:hidden;border-radius:18px;width:min(100%,440px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lhead{padding:28px 28px 22px;border-bottom:1px solid var(--line);background:radial-gradient(260px 160px at 85% 0%,var(--glow),transparent 70%);position:relative}
.leyebrow{font-size:.7rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.ltitle{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.lsub{margin:0;color:var(--muted)}
.lbody{padding:22px 28px 28px;display:grid;gap:16px}
.lbody .fld{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lbody input{background:var(--inputbg);min-height:46px;border-radius:10px;font-size:.95rem;text-transform:none;letter-spacing:0}
.pwwrap{position:relative}.pwwrap input{padding-right:2.6rem}
.pwwrap .ic{position:absolute;right:.85rem;top:50%;transform:translateY(-50%);color:var(--warn);pointer-events:none}
.lbody .btn.primary{min-height:48px;font-size:1rem;border-radius:10px}
.ltheme{position:absolute;top:14px;right:14px}
.mini{color:var(--muted);font-size:.8rem}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.sec2{display:grid;gap:12px}
@media print{#printArea .sheet{page-break-after:always;break-after:page}#printArea .sheet:last-child{page-break-after:auto}}
.pagehead .sp{flex:1}
.grid2>*{min-width:0}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:12px}.exc{min-width:0;overflow:hidden}.exc .legend{flex:none;width:100%}.exc .donutbox{flex-direction:column;align-items:stretch;gap:12px}.exc .donutbox svg.donut{width:170px;height:170px;align-self:center}.exc svg.col{max-width:100%;height:auto}
@media (max-width:900px){.exgrid{grid-template-columns:minmax(0,1fr)}}
.insgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.ins{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2)}
.ins h3{margin:6px 0 4px;font-size:.95rem}.ins p{margin:0;color:var(--muted);font-size:.85rem}
.tag.t-ok{background:var(--ok-soft);color:var(--ok)}
.abcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.abc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;font-size:.8rem}

<script>
'use strict';
/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '';
const fmtH = min => { const t = Math.round(min); const h = Math.floor(t / 60), m = t % 60; return m ? `${h}h${pad(m)}` : `${h}h`; };
const money = n => (n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const groupBy = (a, f) => { const m = new Map(); a.forEach(x => { const k = f(x); (m.get(k) || m.set(k, []).get(k)).push(x); }); return m; };
const byName = (a, b) => a.nome.localeCompare(b.nome, 'pt-BR');
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const durMin = (s, e) => (s && e) ? (toMin(e) - toMin(s) + 1440) % 1440 : 0;
const parseNum = s => { const n = parseFloat(String(s).replace(',', '.')); return isNaN(n) || n < 0 ? 0 : n; };
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); const s = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); };

/* SHA-256 em JS puro (funciona também em http, onde crypto.subtle não existe) */
function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const mp = Math.pow, mw = mp(2, 32); let i, j, result = '';
  const words = [], bitLen = ascii.length * 8;
  let hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], pc = k.length;
  const comp = {};
  for (let c = 2; pc < 64; c++) {
    if (!comp[c]) {
      for (i = 0; i < 313; i += c) comp[i] = c;
      hash[pc] = (mp(c, .5) * mw) | 0; k[pc++] = (mp(c, 1 / 3) * mw) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); if (j >> 8) return; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((bitLen / mw) | 0);
  words[words.length] = bitLen;
  for (j = 0; j < words.length;) {
    const w = words.slice(j, j += 16); const old = hash; hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
        (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; result += (b < 16 ? 0 : '') + b.toString(16); }
  return result;
}
const hashPwd = (pwd, salt) => sha256(String.fromCharCode(...new TextEncoder().encode(salt + '|' + pwd)));


/* ================= ícones (SVG embutido, herdam a cor do texto) ================= */

  print: '<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  pause: '<path d="M8 4v16M16 4v16"/>',

  next: '<path d="m5 4 10 8-10 8Z"/><path d="M19 4v16"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  sheet: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>'
};
const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
/* botão: icon + texto; `only` = só ícone no desktop (com dica), texto aparece no celular */
const ibtn = (act, icon, label, { id = '', cls = '', only = false, extra = '' } = {}) =>
  `<button type="button" class="btn ${only ? 'icon' : ''} ${cls}" data-act="${act}" ${id ? `data-id="${id}"` : ''} ${only ? `title="${label}" aria-label="${label}"` : ''} ${extra}>${ic(icon)}<span class="lbl">${label}</span></button>`;

/* ================= tema claro/escuro ================= */
const getTheme = () => document.documentElement.getAttribute('data-theme') || 'dark';
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('he_theme', t); } catch (e) {} }
const themeBtn = (cls = '') => `<button type="button" class="btn ghost themebtn ${cls}" data-act="toggle-theme" title="${getTheme() === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro'}" aria-label="Alternar tema claro/escuro">${ic(getTheme() === 'dark' ? 'sun' : 'moon')}</button>`;
/* ================= camada de dados (IndexedDB) =================
   Toda a persistência passa por DB.*. Ao migrar para Node + SQLite basta trocar este objeto
   por chamadas fetch('/api/...'); o resto do código continua igual. */
const STORES = { users: 'id', sectors: 'id', employees: 'id', reasons: 'id', snacks: 'id', rules: 'id', entries: 'id', settings: 'key', audit: 'id' };
const CONFIG_STORES = ['users', 'sectors', 'employees', 'reasons', 'snacks', 'rules'];
/* Modo de dados: 'real' (padrão) ou 'demo' (base separada, só com dados simulados). A troca fica neste navegador. */
let MODE = 'real'; try { MODE = localStorage.getItem('he_mode') === 'demo' ? 'demo' : 'real'; } catch (e) {}
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(MODE === 'demo' ? 'he-lanche-demo' : 'he-lanche', 1); let done = false;
      const tm = setTimeout(() => { if (!done) rej(new Error('O banco de dados está ocupado por outra aba aberta deste sistema. Feche as outras abas e recarregue.')); }, 6000);
      r.onupgradeneeded = () => { for (const [n, k] of Object.entries(STORES)) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: k }); };
      r.onsuccess = () => { done = true; clearTimeout(tm); this.db = r.result; this.db.onversionchange = () => { this.db.close(); }; res(); };
      r.onerror = () => { clearTimeout(tm); rej(r.error); };
      r.onblocked = () => {};
    });
  },
  run(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); let out;
      const rq = fn(t.objectStore(store)); if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(store) { return this.run(store, 'readonly', s => s.getAll()); },
  put(store, rec) { return this.run(store, 'readwrite', s => s.put(rec)); },
  putMany(store, recs) { return this.run(store, 'readwrite', s => { recs.forEach(r => s.put(r)); }); },
  del(store, id) { return this.run(store, 'readwrite', s => s.delete(id)); },
  clear(store) { return this.run(store, 'readwrite', s => s.clear()); }
};

/* ================= configuração padrão (regras de negócio) =================
   form: o que o LÍDER enxerga no formulário. perm: o que o LÍDER pode fazer. O RH sempre vê e pode tudo. */
const DEFAULTS = {
  empresa: '', limiteDia: 2, limiteMes: 40, limiteAtivo: true, limiteAviso: 80,
  form: { setor: true, intervalo: true, lanche: true, quantidade: true, preco: false, apoio: true, obs: true, obsObrigatoria: false },
  perm: { novoColab: true, novoMotivo: false, novaOpcao: false, trocarLanche: true, verCustos: false }
};
const FORM_FIELDS = [
  ['setor', 'Setor', 'Mostra o setor do lançamento (o líder só lança no próprio setor).'],
  ['intervalo', 'Intervalo (almoço/janta)', 'Permite descontar o intervalo do total de horas.'],
  ['lanche', 'Opção de lanche', 'Desligado: o lanche é aplicado sozinho pela regra de concessão.'],
  ['quantidade', 'Quantidade de lanches', 'Desligado: usa a quantidade padrão da regra.'],
  ['preco', 'Preço unitário', 'Desligado: o preço vem do cadastro da opção e fica oculto.'],
  ['apoio', 'Colaborador de outro setor (apoio)', 'Permite escolher colaboradores de outros setores.'],
  ['obs', 'Observação', 'Campo de texto livre no fim do formulário.'],
  ['obsObrigatoria', 'Observação obrigatória', 'Só vale quando a observação está visível.']
];
const PERMS = [
  ['novoColab', 'Incluir novo colaborador pelo formulário', 'Mostra o botão ＋ ao lado do colaborador.'],
  ['novoMotivo', 'Incluir novo motivo pelo formulário', 'Mostra o botão ＋ ao lado do motivo.'],
  ['novaOpcao', 'Incluir nova opção de lanche pelo formulário', 'Mostra o botão ＋ ao lado do lanche.'],
  ['trocarLanche', 'Trocar o lanche sugerido pela regra', 'Desligado: o líder não altera opção nem quantidade.'],
  ['verCustos', 'Ver preços e custos de lanche', 'Painel, lista, relatórios e exportações do líder.']
];

/* ================= estado ================= */
const PERFIL = { rh: 'RH', lider: 'Líder de setor', gestor: 'Gestão' };
const S = {
  users: [], sectors: [], employees: [], reasons: [], snacks: [], rules: [], entries: [], audit: [], settings: structuredClone(DEFAULTS),
  me: null, view: 'dashboard', tab: 'users', edit: null, rep: 'colab', draft: null,
  f: { month: todayISO().slice(0, 7), all: false, sectorId: '', status: '', q: '' }
};
const reindex = () => {
  S.sm = new Map(S.sectors.map(x => [x.id, x])); S.em = new Map(S.employees.map(x => [x.id, x]));
  S.rm = new Map(S.reasons.map(x => [x.id, x])); S.om = new Map(S.snacks.map(x => [x.id, x]));
};
const sectorName = id => S.sm.get(id)?.nome || '—';
const empName = id => S.em.get(id)?.nome || '(removido)';
const snackName = id => S.om.get(id)?.nome || '—';
const reasonText = id => S.rm.get(id)?.nome || '—';
const isOutro = id => /outro/i.test(reasonText(id));
const reasonShow = e => { const t = reasonText(e.reasonId); return (isOutro(e.reasonId) && e.reasonOutro) ? `${t} — ${e.reasonOutro}` : t; };
/* ordem estável: motivos pela numeração do texto ("1.", "2."...), "Outro" sempre por último; lanches pela ordem de cadastro */
const reasonSort = (a, b) => {
  const o = /outro/i.test(a.nome) - /outro/i.test(b.nome); if (o) return o;
  const na = parseInt(a.nome) || 1e6, nb = parseInt(b.nome) || 1e6; return na - nb || a.nome.localeCompare(b.nome, 'pt-BR');
};
const snackSort = (a, b) => (a.ord ?? 1e6) - (b.ord ?? 1e6) || a.nome.localeCompare(b.nome, 'pt-BR');
const nextOrd = list => 1 + Math.max(0, ...list.map(x => x.ord || 0));
async function reload(store) {
  if (store === 'settings') {
    const c = (await DB.all('settings')).find(x => x.key === 'cfg') || {};
    S.settings = { ...DEFAULTS, ...c, form: { ...DEFAULTS.form, ...(c.form || {}) }, perm: { ...DEFAULTS.perm, ...(c.perm || {}) } };
    return;
  }
  S[store] = await DB.all(store);
  if (store === 'reasons') S.reasons.sort(reasonSort); else if (store === 'snacks') S.snacks.sort(snackSort);
  reindex();
  if (store === 'users' && S.me) S.me = S.users.find(u => u.id === S.me.id) || null;
}
async function loadAll() { for (const s of [...CONFIG_STORES, 'entries', 'audit', 'settings']) await reload(s); }
async function saveSettings() { await DB.put('settings', { key: 'cfg', ...S.settings }); }
async function log(action, detail = '') {
  await DB.put('audit', { id: uid(), at: new Date().toISOString(), user: S.me?.nome || '—', action, detail });
  S.audit = await DB.all('audit');
  if (S.audit.length > 600) { const old = S.audit.sort((a, b) => a.at.localeCompare(b.at)).slice(0, S.audit.length - 500); for (const o of old) await DB.del('audit', o.id); S.audit = await DB.all('audit'); }
}

/* ================= permissões e regras de visibilidade ================= */
const isRH = () => S.me.perfil === 'rh';
const canWrite = () => S.me.perfil === 'rh' || S.me.perfil === 'lider';
const scopeSector = () => S.me.perfil === 'lider' ? S.me.sectorId : null;
const fshow = k => isRH() || !!S.settings.form[k];       // campo visível no formulário
const can = k => isRH() || !!S.settings.perm[k];          // ação permitida
const showMoney = () => S.me.perfil !== 'lider' || !!S.settings.perm.verCustos;
const canEdit = e => isRH() || (S.me.perfil === 'lider' && e.sectorId === S.me.sectorId && e.status === 'rascunho');
const snackLabel = o => o.nome;
/* ---- horas do setor x horas de pessoas ----
   Horas de pessoas = soma do tempo de cada colaborador (10 pessoas x 2 h = 20 h).
   Horas do setor   = tempo em que o setor teve gente em hora extra, contado uma vez só por dia (10 pessoas x 2 h juntas = 2 h). */
function segsOf(e) {
  const a = toMin(e.start), b = a + (e.bruta || durMin(e.start, e.end));
  if (e.hasInt && e.intIni && e.intFim) { let i1 = toMin(e.intIni), i2 = toMin(e.intFim); if (i1 < a) i1 += 1440; if (i2 < i1) i2 += 1440; if (i1 > a && i2 > i1 && i2 < b) return [[a, i1], [i2, b]]; }
  return [[a, b]];
}
function unionMin(segs) { segs.sort((x, y) => x[0] - y[0]); let tot = 0, cs = null, ce = null; for (const [a, b] of segs) { if (ce === null || a > ce) { if (ce !== null) tot += ce - cs; cs = a; ce = b; } else if (b > ce) ce = b; } return ce === null ? 0 : tot + (ce - cs); }
function sectorTime(list) {
  const by = new Map(); list.forEach(e => { const k = e.sectorId + '|' + e.date; if (!by.has(k)) by.set(k, { sec: e.sectorId, date: e.date, segs: [], pessoa: 0, emps: new Set() }); const g = by.get(k); g.segs.push(...segsOf(e)); g.pessoa += e.min; g.emps.add(e.empId); });
  const out = { min: 0, pessoa: sum(list, e => e.min), days: by.size, bySector: new Map(), byDay: new Map() };
  by.forEach(g => { const m = unionMin(g.segs); out.min += m; out.byDay.set(g.date, (out.byDay.get(g.date) || 0) + m);
    const t = out.bySector.get(g.sec) || { min: 0, days: 0, pessoa: 0, emps: new Set() }; t.min += m; t.days++; t.pessoa += g.pessoa; g.emps.forEach(x => t.emps.add(x)); out.bySector.set(g.sec, t); });
  out.avg = out.min ? out.pessoa / out.min : 0; return out;
}
const fmtAvg = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
/* ---- teto mensal de horas por colaborador (switch + valor editados pelo RH) ---- */
const limMes = () => (S.settings.limiteAtivo !== false && S.settings.limiteMes > 0) ? S.settings.limiteMes : 0;
const limAviso = () => Math.min(99, Math.max(1, S.settings.limiteAviso || 80));

/* ================= cálculo de horas e regra de lanche ================= */
function calcHoras(start, end, hasInt, intIni, intFim) {
  const bruta = durMin(start, end);
  let inter = (hasInt && intIni && intFim) ? durMin(intIni, intFim) : 0;
  if (inter > bruta) inter = bruta;
  return { bruta, inter, liq: Math.max(0, bruta - inter) };
}
const cost = e => e.opcaoId ? (e.qtd || 0) * (e.preco || 0) : 0;
const ehFDS = ds => { const d = new Date(ds + 'T12:00:00'); return d.getDay() === 0 || d.getDay() === 6; };
function regraAplicavel(date, start, end, bruta) {
  if (!date || !start || !end) return null;
  const fds = ehFDS(date), cruzou = toMin(end) <= toMin(start);
  for (const r of S.rules.filter(x => x.ativo !== false)) {
    const dia = r.tipoDia === 'todos' || ((r.tipoDia === 'fds') === fds);
    const min = !r.minHoras || bruta >= (+r.minHoras) * 60;
    const lim = !r.horaLimite || cruzou || toMin(end) >= toMin(r.horaLimite);
    if (dia && min && lim) return r;
  }
  return null;
}
function descRegra(r) {
  if (!r) return 'Sem regra de concessão para este cenário.';
  const dia = { semana: 'Dia de semana', fds: 'Fim de semana', todos: 'Qualquer dia' }[r.tipoDia] || r.tipoDia, cond = [];
  if (r.minHoras) cond.push('HE ≥ ' + r.minHoras + 'h'); if (r.horaLimite) cond.push('trabalhou até ≥ ' + r.horaLimite);
  const perm = (r.opcoesPermitidas || []).map(snackName).join(', ') || 'qualquer';
  const sug = r.sugestao ? `Sugestão automática: <b>${esc(snackName(r.sugestao))}</b>${r.qtdPadrao > 1 ? ' (qtd ' + r.qtdPadrao + ')' : ''}` : `Sem sugestão fixa. Opções: ${esc(perm)}`;
  return `Regra: <b>${dia}</b> · ${cond.join(' e ') || 'sempre'} → ${sug}`;
}
function descRegraCurta(r) {
  const dia = { semana: 'Seg–Sex', fds: 'Sáb–Dom', todos: 'Qualquer dia' }[r.tipoDia] || r.tipoDia, cond = [];
  if (r.minHoras) cond.push('HE ≥ ' + r.minHoras + 'h'); if (r.horaLimite) cond.push('até ≥ ' + r.horaLimite);
  const perm = (r.opcoesPermitidas || []).map(snackName).join(', ') || 'qualquer';
  return `${dia} · ${cond.join(' e ') || 'sempre'} → ${r.sugestao ? snackName(r.sugestao) : 'escolha do líder'} [${perm}]`;
}

/* ================= CSV / XLSX ================= */
function csvCell(v) {
  let s = v == null ? '' : String(v);
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s) && !/^-?\d+([.,]\d+)?$/.test(s)) s = "'" + s; // evita fórmulas no Excel
  if (/[;"\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const delim = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur); if (row.some(x => x !== '')) rows.push(row);
  return rows;
}

  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function seedDemo() {
  const now = new Date().toISOString();
  const sectors = ['Produção', 'Logística', 'Manutenção', 'Administrativo'].map(nome => ({ id: uid(), nome }));
  const names = { 'Produção': ['Carlos Mendes', 'Fernanda Lima', 'João Batista', 'Aline Souza', 'Rafael Costa'], 'Logística': ['Marcos Oliveira', 'Patrícia Alves', 'Diego Santos', 'Luciana Rocha'], 'Manutenção': ['Roberto Silva', 'Eduardo Pires', 'Tiago Martins'], 'Administrativo': ['Camila Ferreira', 'Bruno Araújo', 'Juliana Nunes'] };
  const emps = []; sectors.forEach(s => names[s.nome].forEach(nome => emps.push({ id: uid(), nome, sectorId: s.id, ativo: true })));
  const leaders = [makeUser({ nome: 'Líder Produção', usuario: 'lider.producao', senha: 'demo123', perfil: 'lider', sectorId: sectors[0].id, demo: true }), makeUser({ nome: 'Líder Logística', usuario: 'lider.logistica', senha: 'demo123', perfil: 'lider', sectorId: sectors[1].id, demo: true })];
  await DB.putMany('sectors', sectors); await DB.putMany('employees', emps); await DB.putMany('users', leaders);
  for (const s of ['sectors', 'employees', 'users']) await reload(s);
  const byS = [leaders[0].nome, leaders[1].nome, (S.me ? S.me.nome : 'RH'), (S.me ? S.me.nome : 'RH')];
  let seed = 7; const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const reasons = S.reasons.filter(r => !/outro/i.test(r.nome)); const entries = []; const t = new Date(); const from = new Date(t.getFullYear(), t.getMonth() - 1, 1);
  for (let d = new Date(from); d <= t; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 0) continue;
    const iso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, age = (t - d) / 864e5, sat = d.getDay() === 6;
    sectors.forEach((sc, si) => {
      if (rnd() > (sat ? 0.15 : 0.38)) return;
      const picked = emps.filter(e => e.sectorId === sc.id).sort(() => rnd() - 0.5).slice(0, 1 + Math.floor(rnd() * 3));
      const start = sat ? '08:00' : (rnd() < 0.5 ? '17:30' : '18:00'), dur = sat ? 240 + 30 * Math.floor(rnd() * 3) : 60 + 30 * Math.floor(rnd() * 5);
      const e2 = (toMin(start) + dur) % 1440, end = `${pad(Math.floor(e2 / 60))}:${pad(e2 % 60)}`, reason = reasons[Math.floor(rnd() * reasons.length)];
      const status = age > 7 ? 'enviado' : (rnd() < 0.7 ? 'rascunho' : 'enviado');
      const r = regraAplicavel(iso, start, end, dur), oid = r ? (r.sugestao || (r.opcoesPermitidas || [])[0] || '') : '';
      picked.forEach(e => entries.push({ id: uid(), date: iso, sectorId: sc.id, empId: e.id, apoio: false, reasonId: reason.id, reasonOutro: '', start, end, hasInt: false, intIni: '', intFim: '', bruta: dur, inter: 0, min: dur,
        opcaoId: oid, qtd: oid ? (r.qtdPadrao || 1) : 0, preco: oid ? S.om.get(oid).preco : 0, obs: '', trocado: false, status, by: byS[si], createdAt: now, updatedAt: now }));
    });
  }
  await DB.putMany('entries', entries); await reload('entries');
  S.settings.empresa = 'Empresa Exemplo'; await saveSettings();
}

}
function colChart(series, aria) {
  const W = 480, H = 205, L = 42, R = 8, T = 24, B = 26, iw = W - L - R, ih = H - T - B, n = series.length;
  const top = niceTop(Math.max(...series.map(s => s.v), 0.01)), y = v => T + ih - (v / top) * ih, bw = iw / n, w = Math.max(3, bw * 0.62);
  const grid = [0, .5, 1].map(f => { const v = top * f; return `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="gl"/><text x="${L - 5}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" class="ax">${fmtN(v)}h</text>`; }).join('');
  let last = -1e9;

}

  const grid = [0, .5, 1].map(f => { const v = top * f; return `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="gl"/><text x="${L - 5}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" class="ax">${fmtN(v)}h</text>`; }).join('');
  const withLabels = lines.length <= 2 && n <= 8;

  return `<svg class="col" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><text x="${L}" y="12" class="ax">horas</text>${grid}${paths}${xl}</svg>${legend}`;
}

    let min = g('h') ? Math.round(parseNum(g('h')) * 60) : bruta; if (!(min > 0 && min <= bruta)) min = bruta;
    let s = secMap.get(norm(sn)); if (!s) { s = { id: uid(), nome: sn }; secMap.set(norm(sn), s); newS.push(s); }
    let e = empMap.get(s.id + '|' + norm(en)); if (!e) { e = { id: uid(), nome: en, sectorId: s.id, ativo: true }; empMap.set(s.id + '|' + norm(en), e); newE.push(e); }
    let rs = reaMap.get(norm(rn)); if (!rs) { rs = { id: uid(), nome: rn }; reaMap.set(norm(rn), rs); newR.push(rs); }
    let oid = '', qtd = 0, preco = 0; const on = unq(g('snack'));
    if (on) { let o = snMap.get(norm(on)); if (!o) { o = { id: uid(), nome: on, preco: parseNum(g('preco')) }; snMap.set(norm(on), o); newO.push(o); } oid = o.id; qtd = Math.max(1, parseInt(g('qtd')) || 1); preco = g('preco') ? parseNum(g('preco')) : o.preco; }
    const st = norm(g('status')), hasInt = !!(parseTimeStr(g('ii')) && parseTimeStr(g('ifm')));
    const rec = { id: g('id') || uid(), date, sectorId: s.id, empId: e.id, apoio: norm(g('apoio')) === 'sim', reasonId: rs.id, reasonOutro: unq(g('outro')), start, end, hasInt, intIni: hasInt ? parseTimeStr(g('ii')) : '', intFim: hasInt ? parseTimeStr(g('ifm')) : '',
      bruta, inter: bruta - min, min, opcaoId: oid, qtd, preco, obs: unq(g('obs')), trocado: norm(g('troc')) === 'sim', status: st === 'rascunho' ? 'rascunho' : 'enviado', by: unq(g('by')) || S.me.nome, createdAt: g('cr') || now, updatedAt: g('up') || now };
    const ex = existing.get(rec.id);
    if (!ex) add.push(rec); else if (rec.updatedAt > (ex.updatedAt || '')) upd.push(rec); else skipped++;
  });
  const created = newS.length + newE.length + newR.length + newO.length;
  const ok = await confirmDlg({ title: 'Importar CSV?', ok: 'Importar', body: `<p><b>${add.length}</b> novos · <b>${upd.length}</b> atualizados · <b>${skipped}</b> já existentes (ignorados) · <b>${errors.length}</b> com erro.</p>
    ${created ? `<p>Serão criados ${newS.length} setores, ${newE.length} colaboradores, ${newR.length} motivos e ${newO.length} opções de lanche.</p>` : ''}
    ${errors.length ? `<p class="err">${errors.slice(0, 5).map(esc).join('<br>')}${errors.length > 5 ? '<br>…' : ''}</p>` : ''}` });
  if (!ok || !(add.length || upd.length)) return;
  await DB.putMany('sectors', newS); await DB.putMany('employees', newE); await DB.putMany('reasons', newR); await DB.putMany('snacks', newO); await DB.putMany('entries', [...add, ...upd]);
  for (const s of ['sectors', 'employees', 'reasons', 'snacks', 'entries']) await reload(s);
  await log('Importou CSV', `${add.length} novos, ${upd.length} atualizados (${file.name})`); renderView(); toast('Importação concluída.');
}

/* ================= configuração e backup (JSON) ================= */
async function exportJSON(kind) {
  const cfg = { versao: 2, tipo: kind, geradoEm: new Date().toISOString() };
  for (const s of CONFIG_STORES) cfg[s] = S[s];
  cfg.settings = S.settings; if (kind === 'backup') cfg.entries = S.entries;
  downloadBlob(`${kind === 'backup' ? 'backup' : 'configuracao'}-he-lanche-${todayISO()}.json`, JSON.stringify(cfg), 'application/json');
  toast(kind === 'backup' ? 'Backup baixado.' : 'Configuração exportada. Envie aos líderes.');
}
async function importJSON(file, { fromLogin = false } = {}) {
  if (!file) return;
  let j; try { j = JSON.parse(await file.text()); } catch (e) { return toast('Arquivo inválido.'); }
  if (!j || j.versao !== 2 || !Array.isArray(j.users) || !Array.isArray(j.sectors)) return toast('Esse arquivo não é uma configuração deste sistema.');
  const withEntries = Array.isArray(j.entries);
  const ok = await confirmDlg({ title: withEntries ? 'Restaurar backup?' : 'Importar configuração?', danger: true, ok: withEntries ? 'Restaurar' : 'Importar',
    body: `<p>${withEntries ? `Substitui <b>tudo</b> deste dispositivo, inclusive os ${S.entries.length} lançamentos atuais.` : 'Substitui usuários, setores, colaboradores, lanches, motivos, regras e switches deste dispositivo. Os lançamentos ficam como estão.'}</p><p class="muted small">Você precisará entrar de novo.</p>` });
  if (!ok) return;
  for (const s of CONFIG_STORES) { await DB.clear(s); await DB.putMany(s, j[s] || []); }
  await DB.put('settings', { key: 'cfg', ...(j.settings || {}) });
  if (withEntries) { await DB.clear('entries'); await DB.putMany('entries', j.entries); }
  await loadAll(); try { sessionStorage.removeItem('he_uid'); } catch (e) {} S.me = null; render(); toast(fromLogin || !withEntries ? 'Configuração importada. Faça login.' : 'Backup restaurado. Faça login.');
}

/* ================= eventos ================= */
const ACT = {
  nav: el => { narrStop(); S.view = el.dataset.v; S.edit = null; renderShell(); window.scrollTo(0, 0); },
  logout,
  
  'goto-draft': () => { S.view = 'entries'; S.f.status = 'rascunho'; renderShell(); },
  'new-entry': () => openEntry(),
  edit: el => openEntry(el.dataset.id),
  del: async el => {
    const e = S.entries.find(x => x.id === el.dataset.id); if (!e) return;
    if (await confirmDlg({ title: 'Excluir lançamento?', danger: true, ok: 'Excluir', body: `<p>${esc(empName(e.empId))} · ${fmtDate(e.date)} · ${fmtH(e.min)}</p>` })) {
      await DB.del('entries', e.id); await reload('entries'); await log('Excluiu lançamento', `${empName(e.empId)} em ${fmtDate(e.date)}`); renderView(); toast('Lançamento excluído.');
    }
  },
  'send-rh': async () => {
    const ids = $$('.chk-env:checked').map(c => c.dataset.id);
    if (!ids.length) return toast('Marque ao menos um rascunho na lista.');
    if (await confirmDlg({ title: 'Enviar ao RH?', ok: 'Enviar', body: `<p>${ids.length} lançamento(s) serão enviados. Depois de enviados, o setor não consegue mais editar ou excluir.</p>` })) { await setStatus(ids, 'enviado'); toast('Enviado ao RH.'); }
  },
  reopen: async el => { if (await confirmDlg({ title: 'Reabrir lançamento?', ok: 'Reabrir', body: '<p>Volta para rascunho e o setor poderá editar de novo.</p>' })) setStatus([el.dataset.id], 'rascunho'); },
  'dlg-close': closeDlg,
  'qa-open': el => {
    if (el.dataset.kind === 'emp') { $('#empNew').hidden = false; $('#empNewName').focus(); return; }
    const p = el.closest('.fld').querySelector('[data-qa]'); p.hidden = false; p.querySelector('input').focus();
  },
  'qa-cancel': el => { el.closest('[data-qa]').hidden = true; },
  'qa-save': el => quickSave(el.dataset.kind, el),
  'emp-new-cancel': () => { $('#empNew').hidden = true; },
  'emp-new-save': saveNewEmp,
  'chip-x': el => { S.draft.emps = S.draft.emps.filter(i => i !== el.dataset.id); renderEmpPick(); entryChanged(); },
  'swap-snack': () => { const s = ef().opcaoId; if (!s) return; S.draft.touched = true; s.focus(); toast('Troca livre: escolha a opção desejada.'); },
  'export-entries': () => exportEntries(entryRows(), `horas-extras-${S.f.all ? 'todos' : S.f.month}`),
  'export-xlsx': () => exportEntries(entryRows(), `horas-extras-${S.f.all ? 'todos' : S.f.month}`, true),
  'print-entries': printEntries, 'blank-open': openBlank, 'toggle-theme': () => { setTheme(getTheme() === 'dark' ? 'light' : 'dark'); render(); },
  'export-all': () => exportEntries(S.entries, `horas-extras-completo-${todayISO()}`),
  'export-all-xlsx': () => exportEntries(S.entries, `horas-extras-completo-${todayISO()}`, true),
  'export-report': exportReport, 'print-report': printReportView,
  'export-config': () => exportJSON('config'), 'export-backup': () => exportJSON('backup'),
  'cfg-tab': el => { S.tab = el.dataset.v; S.edit = null; renderView(); },
  'crud-edit': el => { S.edit = { tab: S.tab, id: el.dataset.id }; renderCrud(S.tab); window.scrollTo(0, 0); },
  'crud-cancel': () => { S.edit = null; renderCrud(S.tab); },
  'crud-del': async el => {
    const c = CRUD[S.tab], r = c.items().find(x => x.id === el.dataset.id); if (!r) return;
    const why = c.canDelete(r); if (why) return toast(why);
    if (await confirmDlg({ title: `Excluir ${c.noun}?`, danger: true, ok: 'Excluir', body: `<p>${esc(r.nome || descRegraCurta(r))}</p>` })) {
      await DB.del(S.tab, r.id); await reload(S.tab); await log(`Excluiu ${c.noun}`, r.nome || ''); renderView(); toast('Excluído.');
    }
  },
  'reset-open': resetDialog,
  'demo-regen': async () => {
    if (MODE !== 'demo') return;
    if (await confirmDlg({ title: 'Gerar dados simulados de novo?', ok: 'Gerar', danger: true, body: '<p>Apaga tudo da base de demonstração e cria novos dados fictícios. Os dados reais não são tocados.</p>' })) {
      for (const st of Object.keys(STORES)) await DB.clear(st); setMode('demo');
    }
  },
  'narr-start': narrStart, 'narr-prev': narrPrev, 'narr-next': narrNext, 'narr-play': narrPlay, 'narr-stop': narrStop,
  'limit-open': openLimit, 'print-dash': printDash, 'print-analysis': printAnalysis
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || !ACT[el.dataset.act]) return; if (el.type !== 'checkbox') e.preventDefault(); ACT[el.dataset.act](el); });
const FORMS = { fBlank: printBlankSheet, fLogin: submitLogin, fEntry: submitEntry, fCrud: submitCrud, fParams: submitParams, fLimit: submitLimit };
document.addEventListener('submit', e => { const fn = FORMS[e.target.id]; if (fn) { e.preventDefault(); fn(e.target); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) { const k = t.dataset.f; if (k === 'all') S.f.all = t.checked; else if (k === 'month') { if (!t.value) return; S.f.month = t.value; } else S.f[k] = t.value; renderView(); return; }
  if (t.dataset.ex) { S.ex[t.dataset.ex] = t.value; if (t.dataset.ex === 'dim') S.ex.chart = 'auto'; $('#explorer').innerHTML = explorerHTML(); return; }
  if (t.dataset.heat) { S.heatYear = +t.value; $('#heat').innerHTML = heatHTML(); return; }
  if (t.id === 'narr-voice') { try { localStorage.setItem(VOICE_KEY, t.value); } catch (e) {} if (NARR.playing) narrSpeak(); return; }
  if (t.id === 'narr-speed') { if (NARR.playing) narrSpeak(); return; }
  if (t.hasAttribute('data-mode')) { const on = t.checked; setMode(on ? 'demo' : 'real'); return; }
  if (t.dataset.cfg) { setCfg(t.dataset.cfg, t.checked); return; }
  if (t.closest('#fBlank')) { blankInfo(); return; }
  if (t.id === 'rep') { S.rep = t.value; renderView(); return; }
  if (t.id === 'chkAll') { $$('.chk-env').forEach(c => { c.checked = t.checked; }); return; }
  if (t.id === 'empSel') { addEmp(t.value); return; }
  if (t.id === 'impFile') { const f = t.files[0]; t.value = ''; importFile(f); return; }
  if (t.id === 'impCfg' || t.id === 'impBackup' || t.id === 'impCfgLogin') { const f = t.files[0]; t.value = ''; importJSON(f, { fromLogin: t.id === 'impCfgLogin' }); return; }
  if (t.closest('#fEntry')) {
    const d = S.draft;
    if (t.name === 'sectorId') { d.sectorId = t.value; d.emps = []; renderEmpPick(); }
    else if (t.name === 'apoio') { d.apoio = t.checked; renderEmpPick(); }
    else if (t.name === 'reasonId') { $('#w-outro').hidden = !isOutro(t.value); }
    else if (t.name === 'hasInt') { $('#w-int').hidden = !t.checked; }
    else if (t.name === 'opcaoId') { d.touched = true; const el = ef(); if (el.preco) el.preco.value = t.value ? num2(snackPrice(t.value)) : ''; if (el.qtd && t.value && !(+el.qtd.value > 0)) el.qtd.value = 1; }
    else if (t.name === 'qtd') d.touched = true;
    d.ack = false; entryChanged(); return;
  }
  if (t.closest('#fCrud')) syncWhen();
});
let qTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f === 'q') { S.f.q = t.value; clearTimeout(qTimer); qTimer = setTimeout(refreshEntriesTable, 150); }
  else if (t.closest('#fBlank')) blankInfo();
  else if (t.closest('#fEntry') && ['start', 'end', 'date', 'intIni', 'intFim', 'qtd', 'preco'].includes(t.name)) { S.draft.ack = false; entryChanged(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'empNewName') { e.preventDefault(); saveNewEmp(); } else if (e.key === 'Enter' && e.target.dataset.qf) { e.preventDefault(); e.target.closest('[data-qa]').querySelector('[data-act="qa-save"]').click(); } });

/* ================= inicialização ================= */
(async function boot() {
  try { await DB.open(); await loadAll(); await ensureDefaultRH(); }
  catch (err) { $('#app').innerHTML = `<div class="loginwrap"><div class="logincard"><h2>Não foi possível abrir o armazenamento local</h2><p>Este navegador bloqueou o IndexedDB (modo anônimo ou política da empresa). Abra em uma janela normal.</p><p class="muted small">${esc(err.message || err)}</p></div></div>`; return; }
  try { S.me = S.users.find(u => u.id === sessionStorage.getItem('he_uid')) || null; } catch (e) {}
  render();
})();
</script>
